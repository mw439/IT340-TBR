<header class="navbar">
  <nav class="nav-links">
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a routerLink="/browse" routerLinkActive="active">Browse</a>
    <a routerLink="/search" routerLinkActive="active">Search</a>

    <!-- Cart with count badge -->
    <a routerLink="/cart" routerLinkActive="active" class="cart-link">
      Cart
      <ng-container *ngIf="(cartCount$ | async) as c">
        <span class="cart-badge" *ngIf="c > 0">{{ c }}</span>
      </ng-container>
    </a>

    <a routerLink="/contact" routerLinkActive="active">Contact</a>

    <ng-container *ngIf="!(isLoggedIn$ | async); else loggedInLinks">
      <a routerLink="/login" routerLinkActive="active">Login</a>
    </ng-container>

    <ng-template #loggedInLinks>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <button type="button" class="logout-button" (click)="onLogout()">
        Logout
      </button>
    </ng-template>

    <button class="dark-toggle" (click)="toggleDarkMode()">🌙</button>
  </nav>
</header>

<router-outlet></router-outlet>
