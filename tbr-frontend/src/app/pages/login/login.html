<div class="login-container" *ngIf="showLogin">
  <h2>Login</h2>

  <form (ngSubmit)="onLoginSubmit()">
    <label for="login-email">Email</label>
    <input
      type="email"
      id="login-email"
      name="loginEmail"
      [(ngModel)]="loginEmail"
      placeholder="you@example.com"
      required
    />

    <label for="login-password">Password</label>
    <input
      type="password"
      id="login-password"
      name="loginPassword"
      [(ngModel)]="loginPassword"
      placeholder="Enter your password"
      required
    />

    <div class="actions">
      <a (click)="showLogin = false; showForgot = true" class="forgot">Forgot password?</a>
      <button type="submit">Login</button>
    </div>

    <p class="register-link">
      Don’t have an account?
      <a (click)="showLogin = false; showRegister = true">Register</a>
    </p>
  </form>
</div>
