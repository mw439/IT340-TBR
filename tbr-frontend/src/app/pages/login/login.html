<main class="login-wrapper">

  <!-- LOGIN PANEL -->
  <div class="login-container" *ngIf="showLogin">
    <h2>Login</h2>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />

      <div class="actions">
        <a (click)="showLogin = false; showForgot = true" class="forgot">Forgot password?</a>
        <button type="submit">Login</button>
      </div>

      <p class="register-link">
        Don’t have an account?
        <a (click)="showLogin = false; showRegister = true">Register</a>
      </p>
    </form>
  </div>

  <!-- REGISTER PANEL -->
  <div class="login-container" *ngIf="showRegister">
    <h2>Create Your Account</h2>
    <form>
      <label for="reg-name">Full Name</label>
      <input type="text" id="reg-name" placeholder="Enter name" required />

      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" placeholder="Enter email" required />

      <label for="reg-pass">Password</label>
      <input type="password" id="reg-pass" placeholder="Create password" required />

      <label for="reg-confirm">Confirm Password</label>
      <input type="password" id="reg-confirm" placeholder="Confirm password" required />

      <button type="submit">Register</button>

      <p class="register-link">
        Already have an account?
        <a (click)="showRegister = false; showLogin = true">Return to Login</a>
      </p>
    </form>
  </div>

  <!-- FORGOT PASSWORD PANEL -->
  <div class="login-container" *ngIf="showForgot">
    <h2>Reset Password</h2>
    <form>
      <label for="fp-email">Enter your email</label>
      <input type="email" id="fp-email" placeholder="you@example.com" required />

      <button type="submit">Send Reset Link</button>

      <p class="register-link">
        Remember your password?
        <a (click)="showForgot = false; showLogin = true">Return to Login</a>
      </p>
    </form>
  </div>

</main>
