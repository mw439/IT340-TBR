<main class="profile-container">

  <section class="profile-card">
    <div class="profile-header">
      <img class="avatar" src="https://ui-avatars.com/api/?name={{user.username}}" alt="User Avatar" />
      <h2>{{ user.username }}</h2>
      <p>{{ user.email }}</p>
    </div>

    <hr />

    <div class="profile-details">
      <h3>Account Information</h3>

      <p><strong>User ID:</strong> {{ user.id }}</p>
      <p><strong>Username:</strong> {{ user.username }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
    </div>

    <hr />

    <div class="actions">
      <button class="edit-btn" disabled>✏️ Edit Profile (coming soon)</button>
      <button class="password-btn" disabled>🔑 Change Password (coming soon)</button>
    </div>
  </section>

</main>
