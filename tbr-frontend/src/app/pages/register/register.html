<div class="register-container">
  <h2>Create Account</h2>

  <form (ngSubmit)="onRegisterSubmit()">
    <input type="text" [(ngModel)]="username" name="username" placeholder="Username" required />
    <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
    <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
    <input type="password" [(ngModel)]="confirm" name="confirm" placeholder="Confirm Password" required />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit">Register</button>
  </form>

  <!-- Return to Login link centered and on next line -->
  <p class="login-link" style="text-align: center; margin-top: 1.5rem;">
    <a routerLink="/login">Return to Login</a>
  </p>
</div>
