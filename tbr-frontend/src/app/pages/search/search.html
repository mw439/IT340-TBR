<div class="search-page">
  <h1 class="title">Search Books</h1>
  <p class="subtitle">Search Harry Potter books and other titles using our backend search API.</p>

  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Try: harry potter, sorcerer's stone, fantasy..."
      (keyup.enter)="onSearch()"
    />
    <button (click)="onSearch()" [disabled]="loading">Search</button>
    <button class="secondary" (click)="clear()" [disabled]="loading">Clear</button>
  </div>

  <div class="status">
    <p *ngIf="loading">Searching…</p>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>
  </div>

  <div class="results" *ngIf="!loading && results.length > 0">
    <div class="card" *ngFor="let book of results">
      <div class="cover">
        <img *ngIf="book.coverUrl" [src]="book.coverUrl" alt="cover" />
        <div *ngIf="!book.coverUrl" class="no-cover">No Cover</div>
      </div>

      <div class="info">
        <div class="row">
          <h3 class="book-title">{{ book.title }}</h3>
          <span class="price" *ngIf="book.price">${{ book.price }}</span>
        </div>

        <p class="author">Author: {{ book.author }}</p>
        <p class="meta" *ngIf="book.firstPublishYear">First Published: {{ book.firstPublishYear }}</p>
        <p class="meta" *ngIf="book.isbn">ISBN: {{ book.isbn }}</p>
      </div>
    </div>
  </div>
</div>
